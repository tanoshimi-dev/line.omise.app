services:
  line-web:
    build:
      context: ../03_frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api-line.omise.app
    restart: unless-stopped
    env_file:
      - ../03_frontend/web/.env
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.line-web.rule=Host(`line.omise.app`)"
      - "traefik.http.routers.line-web.entrypoints=https"
      - "traefik.http.routers.line-web.tls=true"
      - "traefik.http.routers.line-web.tls.certresolver=cloudflare"
      - "traefik.http.services.line-web.loadbalancer.server.port=3000"
    networks:
      - line-omise-web
      - line-omise-internal
    depends_on:
      - line-api

  line-api:
    build:
      context: ../02_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../02_backend/.env
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.line-api.rule=Host(`api-line.omise.app`)"
      - "traefik.http.routers.line-api.entrypoints=https"
      - "traefik.http.routers.line-api.tls=true"
      - "traefik.http.routers.line-api.tls.certresolver=cloudflare"
      - "traefik.http.services.line-api.loadbalancer.server.port=8080"
    networks:
      - line-omise-web
      - line-omise-internal
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Credentials are not committed — create this file on the VPS (not
    # tracked; see sys/secrets/). Must define POSTGRES_USER,
    # POSTGRES_PASSWORD, POSTGRES_DB matching line-api's DATABASE_URL.
    env_file:
      - ../secrets/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - line-omise-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  line-omise-web:
    external: true
    name: traefik-network
  line-omise-internal:
    name: line-omise-internal

volumes:
  postgres-data:
